name: Veyra branding source snapshot

on:
  push:
    branches: [feature/ru-ui-polish-and-releases]
    paths: [.github/workflows/ru-brand-source.yml]

permissions:
  contents: read

jobs:
  source:
    if: github.repository == 'maxliv234-star/pdfcraft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect tracked sources without fonts or credentials
        shell: python
        run: |
          import os, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'veyra-branding-source.tar.gz'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open(output, 'w:gz') as archive:
              for name in paths:
                  if not name:
                      continue
                  path = root / name
                  if path.suffix.lower() in {'.ttf', '.otf', '.woff', '.woff2', '.ttc'}:
                      continue
                  if path.is_file() and not path.is_symlink():
                      archive.add(path, arcname=name, recursive=False)
      - uses: actions/upload-artifact@v4
        with:
          name: Veyra-branding-source
          path: ${{ runner.temp }}/veyra-branding-source.tar.gz
          retention-days: 1
          if-no-files-found: error
