name: Stage verified Pages sidebar source

# Source and UI tests: 38301943235. Corrected attribution tests: 38305884435.
# This job only stores verified non-workflow Git objects. It never moves refs.
# Workflow changes require the user's authorized GitHub connection separately.
on:
  push:
    branches: [feature/ru-ui-polish-and-releases]
    paths: ['.github/workflows/ru-pages-review.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-verified-source:
    if: github.repository == 'maxliv234-star/pdfcraft' && github.ref == 'refs/heads/feature/ru-ui-polish-and-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve exact source and successful metadata verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p review
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11771943401/zip" > review/verified.zip
          echo 'f695b6559ae895aa7734c10dea25c128f8c168171a31b46cc4d3c876599ce5be  review/verified.zip' | sha256sum --check
          python3 - <<'PY'
          import hashlib, io, json, pathlib, subprocess
          from zipfile import ZipFile
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'ba0bf701b62c94a35b6ae0b187b166e92c597c8b', 'HEAD'], text=True).splitlines()
          if set(changed) != {'.github/workflows/ru-pages-review.yml'}:
              raise RuntimeError(f'Source baseline changed: {changed}')
          paths = ['crates/ui-egui/src/canvas.rs', 'crates/ui-egui/src/lib.rs', 'crates/ui-egui/src/panels.rs', 'crates/ui-egui/src/pages_panel.rs', 'crates/ui-egui/src/i18n/ru.tsv', 'crates/ui-egui/src/i18n/zh-hans.tsv', 'crates/ui-egui/tests/pages_panel.rs', 'ATTRIBUTION.toml', 'ATTRIBUTION.md']
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          with ZipFile('review/verified.zip') as artifact:
              metadata = artifact.read('metadata-tests.log').decode('utf-8')
              if 'FAILED' in metadata or 'test result: ok. 31 passed; 0 failed;' not in metadata:
                  raise RuntimeError('Corrected metadata suite did not pass')
              if 'assets: ok' not in artifact.read('assets.log').decode('utf-8'):
                  raise RuntimeError('Asset policy did not pass')
              identity = json.loads(artifact.read('SOURCE_IDENTITY.json'))
              with ZipFile(io.BytesIO(artifact.read('final-source.zip'))) as source:
                  if set(source.namelist()) != set(paths + ['.github/workflows/ru-macos.yml']):
                      raise RuntimeError('Unexpected verified source files')
                  for name, digest in identity['sha256'].items():
                      if hashlib.sha256(source.read(name)).hexdigest() != digest:
                          raise RuntimeError(f'Tested source hash mismatch: {name}')
                  entries = [{'path': p, 'mode': '100644', 'type': 'blob', 'content': source.read(p).decode('utf-8')} for p in paths]
                  hashes = {p: hashlib.sha256(source.read(p)).hexdigest() for p in source.namelist()}
          temporary = ['.github/patches/pages-sidebar-module.rs', '.github/patches/pages-sidebar-tests.rs', '.github/patches/apply-pages-sidebar.py', '.github/patches/refine-pages-sidebar.py']
          entries += [{'path': p, 'mode': '100644', 'type': 'blob', 'sha': None} for p in temporary]
          if any(e['path'].startswith('.github/workflows/') for e in entries):
              raise RuntimeError('GITHUB_TOKEN must not edit workflow files')
          pathlib.Path('review/tree.json').write_text(json.dumps({'base_tree': tree, 'tree': entries}), encoding='utf-8')
          pathlib.Path('review/SOURCE_HASHES.json').write_text(json.dumps(hashes, indent=2), encoding='utf-8')
          PY
      - name: Store non-workflow Git tree without moving a branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input review/tree.json --jq .sha > review/TREE_SHA.txt
          printf '%s\n' "$GITHUB_SHA" > review/PARENT_SHA.txt
          echo "Stored source tree: $(cat review/TREE_SHA.txt). No branch or release changed." >> "$GITHUB_STEP_SUMMARY"
      - name: Clean temporary API payload
        if: always()
        run: rm -f review/tree.json review/verified.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-sidebar-git-tree
          path: review/
          if-no-files-found: error
          retention-days: 2
