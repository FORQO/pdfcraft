name: CI

on:
  push:
    # Run the full workspace suite on the final RU integration commit too, not
    # only on PR merge refs. Release tags must use this tested branch tip.
    branches: [main, feature/ru-edition]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly fuzzing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No macOS on PRs, main or nightly: the org's 5 macOS slots are kept for release builds,
        # and release.yml builds macOS (a failing release is fixed and rebuilt).
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The optional craft-fonts build input (Japanese fonts), so the Japanese font tests run on
      # Linux; Windows tests the build without it. See craftrules standards/fonts.md.
      - name: Check out craft-fonts (Linux)
        if: runner.os == 'Linux'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - name: Install Linux system dependencies (egui/winit/rfd)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Test RU release CI gate against green and red run histories
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Latest attempt wins; successful checks from other branches or PRs
          # must never make an untested release commit appear safe.
          sample='{"workflow_runs":[
            {"head_branch":"feature/ru-edition","event":"push","name":"CI","run_number":8,"run_attempt":1,"conclusion":"failure"},
            {"head_branch":"feature/ru-edition","event":"push","name":"CI","run_number":8,"run_attempt":2,"conclusion":"success"},
            {"head_branch":"feature/ru-ui-polish-and-releases","event":"push","name":"CI","run_number":9,"run_attempt":1,"conclusion":"failure"},
            {"head_branch":"feature/ru-edition","event":"push","name":"PdfCraft RU Windows build","run_number":5,"run_attempt":1,"conclusion":"failure"},
            {"head_branch":"feature/ru-edition","event":"push","name":"PdfCraft RU macOS (Apple Silicon)","run_number":5,"run_attempt":1,"conclusion":null},
            {"head_branch":"feature/ru-edition","event":"pull_request","name":"PdfCraft RU macOS (Apple Silicon)","run_number":6,"run_attempt":1,"conclusion":"success"}]}'
          query() { jq -r --arg flow "$1" -f .github/scripts/ru-release-ci.jq <<<"$sample"; }
          test "$(query CI)" = "success"
          test "$(query 'PdfCraft RU Windows build')" = "failure"
          test "$(query 'PdfCraft RU macOS (Apple Silicon)')" = "missing"
          test "$(query 'No such workflow')" = "missing"

      - name: Verify RU Windows triggers do not duplicate PR builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ru-windows.yml').read_text(encoding='utf-8')
          triggers = workflow.split("\npermissions:", 1)[0]
          assert "  push:\n    branches: [feature/ru-edition]\n" in triggers, "only integration commits may trigger push builds"
          assert "  pull_request:\n    branches: [feature/ru-edition]\n" in triggers, "PR builds must remain enabled"
          assert "  workflow_dispatch:\n" in triggers, "manual build trigger must remain enabled"
          PY

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      - name: Test (with craft-fonts)
        if: runner.os == 'Linux'
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo test --workspace

      - name: Layering
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        if: runner.os == 'Linux'
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        if: runner.os == 'Linux'
        run: cargo check -p pdfcraft-cli --no-default-features

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - name: Check library crates for wasm32
        run: cargo xtask wasm

  deny:
    name: dependency licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Use a pinned native installer to avoid depending on Docker Hub image pulls.
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny
      - name: Check dependency licences and advisories
        run: cargo deny check

  fuzz:
    name: fuzz (mutation, 15 min)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
      - name: Fetch the pdf.js corpus (seeds)
        run: cargo xtask corpus
      - name: Fuzz
        run: cargo xtask fuzz --time 900 --seed ${{ github.run_number }}
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-out/findings
          if-no-files-found: ignore
